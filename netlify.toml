[build]
  publish = "."
  functions = "netlify/functions"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Old pages from the previous website: send visitors to the homepage
[[redirects]]
  from = "/risetogreatness"
  to = "/"
  status = 301

[[redirects]]
  from = "/event-details/*"
  to = "/"
  status = 301
